<div class="atlas-dialog-backdrop" (click)="close.emit()">
  <section class="atlas-dialog" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <header class="atlas-dialog-head">
      <div>
        <h2>{{ title() }}</h2>
        @if (description()) {
          <p>{{ description() }}</p>
        }
      </div>
      <button atlasButton variant="ghost" size="sm" type="button" (click)="close.emit()">
        Close
      </button>
    </header>
    <div class="atlas-dialog-body"><ng-content /></div>
  </section>
</div>
