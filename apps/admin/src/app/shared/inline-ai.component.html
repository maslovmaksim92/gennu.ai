<aside class="inline-ai">
  <div class="inline-ai-head">
    <div>
      <span class="eyebrow">AI COPILOT</span>
      <h3>{{title}}</h3>
    </div>
    <span class="status">Chat</span>
  </div>
  <div class="inline-ai-messages">
    @for(item of messages(); track $index) {
      <div class="mini-message" [class.me]="item.role === 'user'">
        <small>{{item.role === 'user' ? 'You' : 'Proto AI'}}</small>
        <p>{{item.content}}</p>
      </div>
    }
    @empty {
      <p class="muted">
        Ask AI to propose structure, tokens, variants or JSON. AI does not publish changes automatically.
      </p>
    }
  </div>
  <form (ngSubmit)="send()" class="inline-ai-compose">
    <textarea name="prompt" [(ngModel)]="prompt" rows="4" [placeholder]="placeholder">
    </textarea>
    <button class="primary" [disabled]="loading()">{{loading() ? 'Thinking…' : 'Ask AI'}}</button>
  </form>
</aside>
