<div class="shell">
  <aside>
    <div class="brand">
      <span class="brand-mark">▲</span>
      <div>
        <strong>Proto.ai</strong>
        <small>Admin</small>
      </div>
    </div>

    <div class="nav-section">
      <span class="nav-label">Workspace</span>
      <nav>
        <a routerLink="/dashboard" routerLinkActive="active">Overview</a>
        <a routerLink="/admins" routerLinkActive="active">Administrators</a>
        <a routerLink="/users" routerLinkActive="active">Users</a>
      </nav>
    </div>

    <div class="nav-section">
      <span class="nav-label">Content</span>
      <nav>
        <a routerLink="/themes" routerLinkActive="active">Themes</a>
        <a routerLink="/blocks" routerLinkActive="active">Blocks</a>
        <a routerLink="/ai" routerLinkActive="active">AI</a>
      </nav>
    </div>

    <div class="nav-section">
      <span class="nav-label">Platform</span>
      <nav>
        <a routerLink="/integrations" routerLinkActive="active">Integrations</a>
      </nav>
    </div>

    <div class="account">
      <div class="account-avatar">{{ auth.user()?.email?.charAt(0)?.toUpperCase() || 'A' }}</div>
      <div class="account-copy">
        <strong>{{ auth.user()?.email }}</strong>
        <button (click)="logout()">Sign out</button>
      </div>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <div class="topbar-breadcrumb">Proto.ai <span>/</span> Admin</div>
      <div class="topbar-badge">Production</div>
    </header>
    <router-outlet />
  </main>
</div>
