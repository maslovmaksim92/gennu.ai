<section class="page ai-page">
  <header class="page-head">
    <div>
      <span class="eyebrow">AI ASSISTANT</span>
      <h1>Chat</h1>
      <p>Ask about platform architecture, themes, blocks and administration.</p>
    </div>
  </header>
  <div class="chat panel">
    <div class="messages">
      @for (item of messages(); track $index) {
        <div class="message" [class.me]="item.role === 'user'">
          <small>{{ item.role === 'user' ? 'You' : 'Proto AI' }}</small>
          <p>{{ item.content }}</p>
        </div>
      }
    </div>
    <form class="composer" (ngSubmit)="send()">
      <textarea name="message" [(ngModel)]="message" placeholder="Ask Proto AI…" rows="3">
      </textarea>
      <button class="primary" [disabled]="loading()">{{ loading() ? 'Thinking…' : 'Send' }}</button>
    </form>
  </div>
</section>
