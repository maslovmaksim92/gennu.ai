<section class="page">
  <header class="page-head">
    <div>
      <span class="eyebrow">ACCESS</span>
      <h1>Administrators</h1>
      <p>Manage active administrators and invitations.</p>
    </div>
    <button atlasButton type="button" (click)="openInvite()">Add admin</button>
  </header>

  @if (inviteToken()) {
    <div class="panel form-row">
      <span>Invitation token</span>
      <code class="token">{{ inviteToken() }}</code>
    </div>
  }

  <div class="panel grid-panel">
    <ag-grid-angular
      [rowData]="rows()"
      [columnDefs]="cols"
      [pagination]="true"
      [paginationPageSize]="20"
    />
  </div>
</section>
