<section class="page">
  <header class="page-head">
    <div><span class="eyebrow">ACCESS</span><h1>Administrators</h1><p>Manage active administrators and invitations.</p></div>
    <button protoButton (click)="showInvite.set(!showInvite())">Add admin</button>
  </header>
  @if (showInvite()) {
    <div class="panel form-row">
      <proto-field label="Administrator email" hint="An invitation token will be generated for this address.">
        <input protoInput type="email" placeholder="admin@example.com" [(ngModel)]="inviteEmail" />
      </proto-field>
      <button protoButton (click)="invite()">Create invite</button>
      @if (inviteToken()) { <code class="token">{{ inviteToken() }}</code> }
    </div>
  }
  <div class="panel grid-panel">
    <ag-grid-angular style="width: 100%; height: 420px" [rowData]="rows()" [columnDefs]="cols" [pagination]="true" [paginationPageSize]="20" />
  </div>
</section>
