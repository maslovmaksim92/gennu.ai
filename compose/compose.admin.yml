services:
  admin:
    build:
      context: ..
      dockerfile: docker/admin.Dockerfile
    environment:
      NODE_ENV: production
      ADMIN_PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-proto}
      POSTGRES_USER: ${POSTGRES_USER:-proto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - proto-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proto} -d ${POSTGRES_DB:-proto}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  proto-postgres:
