services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: proto
      POSTGRES_USER: proto
      POSTGRES_PASSWORD: proto
    ports:
      - '5432:5432'
    volumes:
      - proto-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U proto -d proto']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  proto-postgres:
